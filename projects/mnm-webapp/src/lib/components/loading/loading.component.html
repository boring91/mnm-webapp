@if (isBlockingLoadingShown()) {
  <div class="mnm-loading-overlay" animate.enter="mnm-overlay-enter" animate.leave="mnm-overlay-leave">
    <div class="mnm-spinner"></div>
  </div>
}
@if (isLoadingShown()) {
  <div class="mnm-progress is-active" animate.enter="mnm-progress-enter" animate.leave="mnm-progress-leave">
    <div class="mnm-indeterminate"></div>
  </div>
}
